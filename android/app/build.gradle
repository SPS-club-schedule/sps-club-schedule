plugins { id 'com.android.application' }

def signingFile = rootProject.file(System.getenv('SPS_ANDROID_SIGNING_PROPERTIES') ?: 'signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'org.spsclub.schedule'
    compileSdk 36
    defaultConfig {
        applicationId 'org.spsclub.schedule'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.6.0'
        manifestPlaceholders = [appLabel: 'SPS 社团日程']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
    lint { abortOnError true }
}
def bundleFrontend = tasks.register('bundleFrontend', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build.mjs', '--android'
    inputs.files(['client','shared','scripts','experience'].collect { fileTree(rootProject.file('../'+it)) })
    inputs.files(rootProject.file('../package.json'),rootProject.file('../package-lock.json'))
    outputs.dir(layout.buildDirectory.dir('generated/webAssets'))
}
tasks.named('preBuild').configure { dependsOn bundleFrontend }
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
